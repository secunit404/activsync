[project]
name = "activsync"
version = "1.2.4"
description = "Activity synchronization and publishing control"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "garminconnect>=0.3.6",
    "garmin-auth>=0.3.0",
    "requests>=2.31",
    "tzdata>=2024.1",
    "garmin-fit-sdk>=21.208",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
activsync = ["static/favicon.png", "static/apple-touch-icon.png", "web/*", "web/assets/*"]
