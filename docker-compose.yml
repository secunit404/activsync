name: activsync

services:
  activsync:
    image: ghcr.io/secunit404/activsync:latest
    # To build locally instead of pulling, comment the `image:` line above and
    # uncomment the next line:
    # build: .
    ports:
      - "8381:8381"
    volumes:
      - ./data:/config
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
      # Behind a reverse proxy, name its address (or its Docker network) so
      # X-Forwarded-Proto/-For are trusted from it alone. Avoid `*`: it lets any
      # client pick its own rate-limit address. See the README.
      # - FORWARDED_ALLOW_IPS=172.18.0.0/16
      # Your public address, once it is reachable from the internet — see
      # "Exposing ActivSync publicly" in the README.
      # - ACTIVSYNC_PUBLIC_URL=https://activsync.example.com
