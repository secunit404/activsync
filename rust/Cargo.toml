[package]
name = "activsync"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of the ActivSync server (mock-mode core)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
argon2 = "0.5"
regex = "1"
openidconnect = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
percent-encoding = "2.3.2"
fitparser = "0.12.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
rsa = { version = "0.9", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# argon2 at its real cost takes seconds unoptimised; keep debug builds usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The OIDC tests generate an RSA signing key; unoptimised that takes minutes.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
