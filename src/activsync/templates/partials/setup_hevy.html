<div class="setup-card setup-card-hevy">
  <div class="setup-card-label"><span class="setup-num setup-num-hevy">3</span><h2>Hevy <span class="hint">(optional)</span></h2></div>
  {% if hevy_error %}<p class="error">{{ hevy_error }}</p>{% endif %}
  <form class="stack" method="post" action="/settings/hevy-credentials" onsubmit="return activsyncSetLoading(this)">
    <label>Hevy API key
      <input type="password" name="api_key" autocomplete="off" required>
    </label>
    <button class="primary-action" type="submit">
      <span class="button-label">Connect Hevy →</span>
      <span class="button-loading"><span class="button-spinner" aria-hidden="true"></span>Validating…</span>
    </button>
  </form>
  <p class="hint">Syncs your Hevy gym workouts onto Garmin (and on to Strava). Requires
    <strong>Hevy Pro</strong> — the API key lives in Hevy's settings under Developer.
    Disable any standalone hevy2garmin instance first. You can also connect later from Settings.</p>
  <form method="post" action="/setup/hevy/skip">
    <button type="submit" class="secondary">Skip for now</button>
  </form>
</div>
