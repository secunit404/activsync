name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            activities
            api
            auth
            db
            deps
            docker
            garmin
            hevy
            main
            onboarding
            readme
            settings
            strava
            sync
            ui
      # Changelog-visible types need a scope so release notes group by area.
      - name: Require a scope on changelog types
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^(feat|fix|perf|revert)!?: ]]; then
            echo "::error::'$TITLE' needs a scope, e.g. fix(sync): ... (see the scopes list in pr-title.yml)"
            exit 1
          fi
