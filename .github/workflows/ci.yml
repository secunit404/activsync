name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install (with dev extras)
        run: pip install ".[dev]"
      - name: Run tests
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (smoke test, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: activsync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
