name: dev-image

on:
  push:
    # release-please's PR branch only ever carries a version bump and a
    # changelog, and a dependabot branch only a dependency bump, so a
    # multi-arch build of either is an image nobody pulls. CI's docker-build
    # job already builds and smoke-tests the image on every PR, so nothing is
    # lost by skipping them — including for Dockerfile bumps.
    branches-ignore: [main, "release-please--**", "dependabot/**"]
  delete:
  workflow_dispatch:

# Per-branch group: each branch owns its own tag, so only a newer push to, or
# the deletion of, the same branch should cancel a build in flight. A delete
# payload's `ref` is the bare branch name while a push's is `refs/heads/...`,
# so both are normalised to the full ref — otherwise a branch deleted on merge
# mid-build gets its cleanup run before the build pushes, and the tag outlives
# the branch.
concurrency:
  group: dev-image-${{ github.event_name == 'delete' && format('refs/heads/{0}', github.event.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve branch tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "tag=$(scripts/dev-image-tag.sh "$BRANCH")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Never touches `latest` or the semver tags.
          tags: type=raw,value=${{ steps.tag.outputs.tag }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Each push moves the branch tag, stranding the previous multi-arch
      # children. The age floor keeps this run from deleting children another
      # branch's build has pushed but not yet tied to its index manifest.
      - name: Prune orphaned image versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true
          older-than: 1 hour

  # The Rust server's image, under the branch tag plus `-rust`. Each platform
  # builds on its own native runner: compiling BoringSSL and the server under
  # QEMU takes over an hour.
  build-rust:
    if: github.event_name != 'delete'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve branch tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "tag=$(scripts/dev-image-tag.sh "$BRANCH")-rust" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=rust-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.arch }}
      - name: Export digest
        id: digest
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish-rust:
    needs: build-rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tie both platforms to the branch tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.build-rust.outputs.tag }}
          AMD64: ${{ needs.build-rust.outputs.digest-amd64 }}
          ARM64: ${{ needs.build-rust.outputs.digest-arm64 }}
        run: docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE@$AMD64" "$IMAGE@$ARM64"

  remove-branch-tag:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve branch tag
        id: tag
        env:
          BRANCH: ${{ github.event.ref }}
        run: echo "tag=$(scripts/dev-image-tag.sh "$BRANCH")" >> "$GITHUB_OUTPUT"
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: ${{ steps.tag.outputs.tag }},${{ steps.tag.outputs.tag }}-rust
